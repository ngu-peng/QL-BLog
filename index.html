<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QL-BLog · 本地日志</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">

    <!-- 区块 1：顶部标题栏 -->
    <header class="header">
      <div class="brand">
        <span class="logo">Q</span>
        <h1 class="brand-name">QL-BLog</h1>
      </div>
      <span class="badge" id="post-count">0 条日志</span>
    </header>

    <!-- 区块 2：发布区卡片 -->
    <section class="composer card">
      <input
        id="title-input"
        class="composer-title"
        type="text"
        maxlength="50"
        placeholder="给这条日志起个标题（可选）"
      />
      <textarea
        id="content-input"
        class="composer-content"
        rows="4"
        maxlength="500"
        placeholder="今天想说点什么……"
      ></textarea>
      <div class="composer-footer">
        <span class="char-count" id="char-count">0 / 500</span>
        <button id="publish-btn" class="btn btn-primary" disabled>发 布</button>
      </div>
    </section>

    <!-- 区块 3：日志列表区 -->
    <main id="post-list" class="post-list" aria-live="polite">
      <!-- 日志卡片由 app.js 动态渲染 -->
    </main>

    <!-- 区块 4：底部操作栏 -->
    <footer class="footer">
      <button id="clear-btn" class="btn btn-danger">清空全部日志</button>
      <p class="copyright">QL-BLog · 数据保存在本浏览器 Local Storage 中</p>
    </footer>

  </div>

  <script src="app.js"></script>
</body>
</html>
